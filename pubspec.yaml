name: ember
description: "A self-discipline app that works like a game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local Persistence & Drift SQLite
  drift: ^2.24.2
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4

  # Security & Biometrics
  local_auth: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Data Visualization & Animation
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2

  # Encryption, Backup & Sharing
  cryptography: ^2.7.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/missions/
    - assets/helplines.json
    - assets/icon/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
